[env:esp32cam]
; pioarduino fork: Arduino core 3.3.11 on IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino

; Dual OTA slots at 1.875MB each, so firmware can be replaced over Wi-Fi without
; touching the board. Changing this later means erasing the device.
board_build.partitions = min_spiffs.csv

build_flags =
  -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The MB wires DTR and RTS to the auto-reset circuit. A monitor that asserts them
; on open holds EN low, which leaves the chip in reset and the console silent.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200

; Same build, delivered over Wi-Fi instead of USB. Use this once the SD card is
; in, since an inserted card holds GPIO2 high and blocks USB flashing entirely.
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = esp32cam-1.local

; The device opens a TCP connection back to this machine to send the image, and
; espota picks a random port between 10000 and 60000 by default. Pinning it means
; the host firewall needs one narrow rule instead of a range.
upload_flags =
  --host_port=45678
