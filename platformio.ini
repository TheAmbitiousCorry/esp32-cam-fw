[env:esp32cam]
; pioarduino fork: Arduino core 3.3.11 on IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino

build_flags =
  -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The MB wires DTR and RTS to the auto-reset circuit. A monitor that asserts them
; on open holds EN low, which leaves the chip in reset and the console silent.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
